name = "falafel"
defaultTargets = ["Falafel"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "Falafel"
roots = ["Statement", "PathStatement", "Falafel"]

[[lean_lib]]
name = "Leaper"
roots = ["LeaperStatement", "Leaper"]

[[lean_lib]]
name = "Straight"
roots = ["StraightStatement", "Straight"]

[[lean_lib]]
name = "Fortress"
roots = ["FortressStatement", "Fortress"]

[[lean_lib]]
name = "TrapCheck"
precompileModules = true

[[lean_lib]]
name = "Trap"
roots = ["TrapStatement", "Trap"]
